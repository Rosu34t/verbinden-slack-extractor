env: prod
slack:
  eventChannel: general
  timesChannels:
    - channel: times-taro
      owner: null
  periodDays: 30
llm:
  provider: gemini
  model: gemini-flash-lite-latest
  maxRetries: 3
  timeoutSeconds: 60
api:
  statusCacheSeconds: 60
  refreshCooldownSeconds: 600
  corsOrigins:
    - http://localhost:3000
output:
  members:
    id: id
    name: name
    iconUrl: iconUrl
    status: status
    intro: intro
paths:
  dataDir: data
