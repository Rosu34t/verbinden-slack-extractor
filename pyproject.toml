[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verbinden-slack-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2",
    "slack-sdk>=3,<4", "google-genai>=1,<2", "httpx>=0.28,<1", "emoji>=2,<3",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["verbinden"]

[tool.coverage.report]
fail_under = 80
show_missing = true
